<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郭子论坛</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Auth Screen -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">郭子论坛</div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" onclick="switchAuthTab('login')">登录</button>
        <button class="auth-tab" data-tab="register" onclick="switchAuthTab('register')">注册</button>
      </div>

      <!-- Phone Input (shared) -->
      <div id="phoneStep">
        <div class="auth-field">
          <label>手机号</label>
          <div class="phone-code-row">
            <input type="tel" id="authPhone" placeholder="请输入手机号" maxlength="11" autocomplete="tel">
            <button type="button" id="sendCodeBtn" class="send-code-btn" onclick="sendVerificationCode()">获取验证码</button>
          </div>
        </div>
        <div class="auth-field">
          <label>验证码</label>
          <input type="text" id="authCode" placeholder="请输入6位验证码" maxlength="6" inputmode="numeric" pattern="[0-9]*">
        </div>
      </div>

      <!-- Username (only for register) -->
      <div id="usernameStep" style="display:none">
        <div class="auth-field">
          <label>设置用户名</label>
          <input type="text" id="authUsername" placeholder="起个名字（1-16个字符）" maxlength="16">
        </div>
      </div>

      <div id="authError" class="auth-error"></div>

      <div class="auth-buttons">
        <button type="button" id="authActionBtn" class="auth-submit" onclick="handleAuth()">登 录</button>
      </div>

      <div id="debugCode" class="debug-code" style="display:none"></div>
      <p class="auth-hint" id="authHint">一个手机号只能绑定一个账号</p>
    </div>
  </div>

  <!-- Forum -->
  <div id="forumApp" style="display:none">
    <header class="site-header">
      <div class="header-inner">
        <div class="header-top">
          <h1 class="site-title">郭子论坛</h1>
          <div class="header-user" id="headerUser">
            <span class="header-username" id="headerUsername"></span>
            <button class="logout-btn" onclick="handleLogout()">退出</button>
          </div>
        </div>
        <p class="site-desc">一个自由的交流空间</p>
      </div>
    </header>

    <main class="container">
      <section class="new-post-section">
        <div class="card form-card">
          <h2 class="section-title">开新帖</h2>
          <form id="postForm">
            <div class="form-row">
              <textarea id="postContent" placeholder="说点什么..." rows="4" maxlength="5000" required></textarea>
            </div>
            <div class="form-row" id="postImageUploadRow"></div>
            <div class="form-row form-actions">
              <button type="submit" id="submitBtn">发 布</button>
              <span id="charCount" class="char-count">0 / 5000</span>
            </div>
          </form>
        </div>
      </section>

      <section class="posts-section">
        <div class="posts-header">
          <h2 class="section-title">全部帖子</h2>
          <span id="postCount" class="post-count">0 条帖子</span>
        </div>
        <div id="postsList" class="posts-list">
          <div class="loading" id="loadingIndicator">加载中...</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>郭子论坛</p>
    </footer>
  </div>

  <script src="/app.js"></script>

  <!-- Profile Modal -->
  <div id="profileModal" class="profile-overlay" style="display:none" onclick="closeProfile(event)">
    <div class="profile-card" onclick="event.stopPropagation()">
      <button class="profile-close" onclick="closeProfile()">✕</button>
      <div id="profileContent">
        <div class="profile-loading">加载中...</div>
      </div>
    </div>
  </div>

</body>
</html>
