<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郭子论坛</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Auth Screen -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">郭子论坛</div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" onclick="switchAuthTab('login')">登录</button>
        <button class="auth-tab" data-tab="register" onclick="switchAuthTab('register')">注册</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" onsubmit="return handleLogin(event)">
        <div class="auth-field">
          <label>手机号</label>
          <input type="tel" id="loginPhone" placeholder="请输入手机号" maxlength="11" required autocomplete="tel">
        </div>
        <div class="auth-field">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" required autocomplete="current-password">
        </div>
        <div id="loginError" class="auth-error"></div>
        <button type="submit" id="loginBtn" class="auth-submit">登 录</button>
        <p class="auth-hint">注册后一个手机号只能绑定一个账号</p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form hidden" onsubmit="return handleRegister(event)">
        <div class="auth-field">
          <label>手机号</label>
          <input type="tel" id="regPhone" placeholder="请输入手机号" maxlength="11" required autocomplete="tel">
        </div>
        <div class="auth-field">
          <label>用户名</label>
          <input type="text" id="regUsername" placeholder="起个名字（1-16个字符）" maxlength="16" required>
        </div>
        <div class="auth-field">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="至少4位密码" minlength="4" required autocomplete="new-password">
        </div>
        <div class="auth-field">
          <label>确认密码</label>
          <input type="password" id="regConfirm" placeholder="再次输入密码" minlength="4" required autocomplete="new-password">
        </div>
        <div id="regError" class="auth-error"></div>
        <button type="submit" id="regBtn" class="auth-submit">注 册</button>
        <p class="auth-hint">一个手机号只能注册一个账号</p>
      </form>
    </div>
  </div>

  <!-- Forum -->
  <div id="forumApp" style="display:none">
    <header class="site-header">
      <div class="header-inner">
        <div class="header-top">
          <h1 class="site-title">郭子论坛</h1>
          <div class="header-user" id="headerUser">
            <span class="header-username" id="headerUsername"></span>
            <button class="logout-btn" onclick="handleLogout()">退出</button>
          </div>
        </div>
        <p class="site-desc">一个自由的交流空间</p>
      </div>
    </header>

    <main class="container">
      <section class="new-post-section">
        <div class="card form-card">
          <h2 class="section-title">开新帖</h2>
          <form id="postForm">
            <div class="form-row">
              <textarea id="postContent" placeholder="说点什么..." rows="4" maxlength="5000" required></textarea>
            </div>
            <div class="form-row" id="postImageUploadRow"></div>
            <div class="form-row form-actions">
              <button type="submit" id="submitBtn">发 布</button>
              <span id="charCount" class="char-count">0 / 5000</span>
            </div>
          </form>
        </div>
      </section>

      <section class="posts-section">
        <div class="posts-header">
          <h2 class="section-title">全部帖子</h2>
          <span id="postCount" class="post-count">0 条帖子</span>
        </div>
        <div id="postsList" class="posts-list">
          <div class="loading" id="loadingIndicator">加载中...</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>郭子论坛</p>
    </footer>
  </div>

  <script src="/app.js"></script>

  <!-- Profile Modal -->
  <div id="profileModal" class="profile-overlay" style="display:none" onclick="closeProfile(event)">
    <div class="profile-card" onclick="event.stopPropagation()">
      <button class="profile-close" onclick="closeProfile()">✕</button>
      <div id="profileContent">
        <div class="profile-loading">加载中...</div>
      </div>
    </div>
  </div>

</body>
</html>
